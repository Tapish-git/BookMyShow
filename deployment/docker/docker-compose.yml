# BookMyShow - Complete Development Environment
# Docker Compose configuration for local development and testing

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bookmyshow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookmyshow
      MYSQL_USER: bookmyshow_user
      MYSQL_PASSWORD: bookmyshow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - bookmyshow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API Service
  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/backend.Dockerfile
    container_name: bookmyshow-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bookmyshow
      DB_USER: bookmyshow_user
      DB_PASSWORD: bookmyshow_pass
      DB_DIALECT: mysql
      SESSION_SECRET: your-super-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      - ../../backend:/app
      - /app/node_modules
    networks:
      - bookmyshow-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Application
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
      target: development
    container_name: bookmyshow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_APP_NAME: BookMyShow
      NODE_ENV: development
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    networks:
      - bookmyshow-network
    depends_on:
      - backend

  # Nginx Reverse Proxy (Production-like setup)
  nginx:
    image: nginx:alpine
    container_name: bookmyshow-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - bookmyshow-network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

  # Redis Cache (Optional - for future enhancements)
  redis:
    image: redis:7-alpine
    container_name: bookmyshow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookmyshow-network
    profiles:
      - cache

  # Adminer - Database Management Tool
  adminer:
    image: adminer:latest
    container_name: bookmyshow-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - bookmyshow-network
    depends_on:
      - mysql
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  bookmyshow-network:
    driver: bridge

# Usage Instructions:
# 
# Development Mode (default):
# docker-compose up -d
# 
# Production Mode with Nginx:
# docker-compose --profile production up -d
# 
# With Redis Cache:
# docker-compose --profile cache up -d
# 
# With Database Tools:
# docker-compose --profile tools up -d
# 
# All Services:
# docker-compose --profile production --profile cache --profile tools up -d
# 
# Build from scratch:
# docker-compose build --no-cache
# 
# View logs:
# docker-compose logs -f [service_name]
# 
# Stop all services:
# docker-compose down
# 
# Clean up (remove volumes):
# docker-compose down -v